[package]
name = "client"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The 2D client shell (Phase 7). It reads the world only through a `SimHandle` (the sim runs on
# its own thread) and gives orders as commands. Raw province values for the debug panel need the
# `inspect` feature, which turns on `meridian-core/omniscient`; it is on by default until the
# country-filtered inspection exists, and a release build for players should turn it off.
[features]
default = ["inspect"]
inspect = ["meridian-core/omniscient"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
meridian-core = { path = "../meridian-core" }
meridian-data = { path = "../meridian-data" }
png = "0.18.1"
pollster = "1.0.1"
proving-ground = { path = "../proving-ground" }
wgpu = "30.0.1"
winit = "0.30.13"
