[workspace]
resolver = "2"
members = ["crates/meridian-core", "crates/proving-ground", "crates/runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Debug builds: light optimization so tests run fast.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
